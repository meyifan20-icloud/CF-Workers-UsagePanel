name: 手动同步官方上游 / Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 cmliu/CF-Workers-UsagePanel → main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify origin is personal repository
        shell: bash
        run: |
          ORIGIN_URL="$(git remote get-url origin)"
          echo "origin=$ORIGIN_URL"
          case "$ORIGIN_URL" in
            *"meyifan20-icloud/CF-Workers-UsagePanel.git"|*"meyifan20-icloud/CF-Workers-UsagePanel") ;;
            *)
              echo "Unexpected origin: $ORIGIN_URL"
              exit 1
              ;;
          esac

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/cmliu/CF-Workers-UsagePanel.git
          git fetch upstream main

      - name: Merge upstream safely
        shell: bash
        run: |
          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit -X ours upstream/main
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "No upstream changes. Repository is already up to date."
            exit 0
          fi

          git push origin HEAD:main
